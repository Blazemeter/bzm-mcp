name: Build Binaries

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            name: linux
            arch: arm64
          - os: windows-latest  
            name: windows
            arch: amd64
          - os: macos-latest
            name: macos
            arch: arm64
          - os: macos-15-intel
            name: macos
            arch: amd64

    steps:
    - uses: actions/checkout@v4
    
    - name: Build binary (Linux in Ubuntu 25.10 container)
      if: matrix.name == 'linux'
      shell: bash
      run: |
        # Docker container with Ubuntu 25.10 and build the binary inside it
        rm -rf dist/*
        docker run --rm \
          -v "$PWD:/workspace" \
          -w /workspace \
          ubuntu:25.10 \
          bash -c "
            set -e
            echo 'Setting up Ubuntu 25.10 build environment...'
            
            apt-get update -y
            apt-get install -y --fix-missing curl python3 python3-pip python3-venv binutils
            
            # Install uv (Python package manager)
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH=\"\$HOME/.local/bin:\$PATH\"
            
            echo 'Building binary with uv...'
            uv sync
            uv run build.py
            
            echo 'Build completed. Checking output:'
            ls -la dist/
          "
    
    - name: Setup uv for Windows/macOS
      if: matrix.name != 'linux'
      uses: astral-sh/setup-uv@v4
    
    - name: Build binary (Windows/macOS native)
      if: matrix.name != 'linux'
      shell: bash
      run: |
        rm -rf dist/*
        uv sync
        uv run build.py
    
    - name: Sign and Notarize macOS binaries
      if: matrix.name == 'macos' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        echo "🔐 Setting up code signing environment..."
        
        # Create temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        
        # Decode and import certificate
        echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
        security import $RUNNER_TEMP/certificate.p12 \
          -k $KEYCHAIN_PATH \
          -P "$APPLE_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/productsign
        
        # Set the keychain to be used by codesign
        security list-keychain -d user -s $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        
        # Save API key
        mkdir -p $RUNNER_TEMP/.apple-keys
        chmod 700 $RUNNER_TEMP/.apple-keys
        echo "$APPLE_API_KEY_P8" | base64 --decode > $RUNNER_TEMP/.apple-keys/AuthKey_$APPLE_API_KEY_ID.p8
        chmod 600 $RUNNER_TEMP/.apple-keys/AuthKey_$APPLE_API_KEY_ID.p8
        
        # Store notarization credentials
        xcrun notarytool store-credentials "bzm-mcp-notary" \
          --key $RUNNER_TEMP/.apple-keys/AuthKey_$APPLE_API_KEY_ID.p8 \
          --key-id $APPLE_API_KEY_ID \
          --issuer $APPLE_ISSUER_ID \
          --keychain $KEYCHAIN_PATH
        
        # Get signing identity
        SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -1 | grep -o '"[^"]*"' | tr -d '"')
        echo "Using signing identity: $SIGNING_IDENTITY"
        
        # Create entitlements file if it doesn't exist
        if [ ! -f entitlements.plist ]; then
          echo "Creating entitlements.plist..."
          cat > entitlements.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <!--
          This entitlements file is intentionally minimal and does not grant
          any permissive code-signing entitlements by default.

          If the packaged binary (for example, a PyInstaller-built app)
          requires additional entitlements such as:
            - com.apple.security.cs.disable-library-validation
            - com.apple.security.cs.allow-jit
            - com.apple.security.cs.allow-unsigned-executable-memory
            - com.apple.security.cs.allow-dyld-environment-variables

          add ONLY the ones that are strictly necessary, and document here
          why each is required and what component depends on it.

          Example (uncomment and adjust only if needed):
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
        -->
        <dict>
        </dict>
        </plist>
        EOF
        fi
        
        # Process the binary
        cd dist
        BINARY="bzm-mcp-${{ matrix.name }}-${{ matrix.arch }}"
        
        if [ -f "$BINARY" ]; then
          echo "📦 Processing $BINARY..."
          
          # Remove quarantine attribute if present
          xattr -d com.apple.quarantine "$BINARY" 2>/dev/null || true
          
          # Remove existing signature
          codesign --remove-signature "$BINARY" 2>/dev/null || true
          
          # Sign with entitlements
          echo "✍️ Signing binary..."
          codesign --sign "$SIGNING_IDENTITY" \
            --entitlements ../entitlements.plist \
            --options runtime \
            --timestamp \
            --force \
            --verbose \
            "$BINARY"
          
          # Verify signature
          echo "🔍 Verifying signature..."
          codesign --verify --verbose "$BINARY"
          codesign --display --verbose=4 "$BINARY" | grep Authority
          
          # Test binary
          echo "🧪 Testing binary..."
          ./"$BINARY" --version || echo "⚠️ Binary test failed, but continuing..."
          
          # Create ZIP
          echo "📦 Creating ZIP..."
          rm -f "${BINARY}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$BINARY" "${BINARY}.zip"
          
          # Notarize ZIP
          echo "☁️ Notarizing ZIP (this takes 1-5 minutes)..."
          xcrun notarytool submit "${BINARY}.zip" \
            --keychain-profile "bzm-mcp-notary" \
            --keychain $KEYCHAIN_PATH \
            --wait
          
          # Verify notarization
          echo "✅ Final verification..."
          spctl --assess --type install "${BINARY}.zip" || echo "✅ Notarized (verification may require extraction)"
          
          echo "✅ $BINARY signed and notarized successfully!"
        else
          echo "⚠️ Binary $BINARY not found, skipping signing"
        fi
        
        # Clean up
        echo "🧹 Cleaning up..."
        security delete-keychain $KEYCHAIN_PATH
        rm -rf $RUNNER_TEMP/certificate.p12
        rm -rf $RUNNER_TEMP/.apple-keys
        
        echo "🎉 Code signing and notarization complete!"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bzm-mcp-${{ matrix.name }}-${{ matrix.arch }}
        path: dist/

  commit-artifacts:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
    
    - name: Organize artifacts into dist/
      shell: bash
      run: |
        mkdir -p dist/
        # Copy all binaries from artifact directories to dist/ 
        # upload-artifacts job does not preserve the executable permission
        # so we need to set it manually: https://github.com/actions/download-artifact?tab=readme-ov-file#limitations

        if [ -d "artifacts/bzm-mcp-linux-amd64" ]; then
          cp artifacts/bzm-mcp-linux-amd64/* dist/
          chmod +x dist/bzm-mcp-linux-amd64
          echo "Copied Linux AMD64 binary"
        fi
        if [ -d "artifacts/bzm-mcp-linux-arm64" ]; then
          cp artifacts/bzm-mcp-linux-arm64/* dist/
          chmod +x dist/bzm-mcp-linux-arm64
          echo "Copied Linux ARM64 binary"
        fi
        if [ -d "artifacts/bzm-mcp-windows-amd64" ]; then
          cp artifacts/bzm-mcp-windows-amd64/* dist/
          echo "Copied Windows AMD64 binary"
        fi
        if [ -d "artifacts/bzm-mcp-macos-arm64" ]; then
          cp -r artifacts/bzm-mcp-macos-arm64/* dist/
          # For macOS, check if we have signed ZIP files
          if [ -f "dist/bzm-mcp-macos-arm64.zip" ]; then
            echo "Found signed and notarized macOS ARM64 ZIP"
          elif [ -d "dist/bzm-mcp-arm64.app" ]; then
            echo "Found macOS ARM64 .app bundle"
          else
            chmod +x dist/bzm-mcp-macos-arm64 2>/dev/null || true
            echo "Copied macOS ARM64 binary"
          fi
        fi
        if [ -d "artifacts/bzm-mcp-macos-amd64" ]; then
          cp -r artifacts/bzm-mcp-macos-amd64/* dist/
          # For macOS, check if we have signed ZIP files
          if [ -f "dist/bzm-mcp-macos-amd64.zip" ]; then
            echo "Found signed and notarized macOS AMD64 ZIP"
          elif [ -d "dist/bzm-mcp-amd64.app" ]; then
            echo "Found macOS AMD64 .app bundle"
          else
            chmod +x dist/bzm-mcp-macos-amd64 2>/dev/null || true
            echo "Copied macOS AMD64 binary"
          fi
        fi

        echo "Final dist/ contents:"
        ls -la dist/ || echo "No dist/ directory found"
    
    - name: Commit all artifacts to repository
      shell: bash
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add dist/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "[skip ci] Update all binary artifacts"
          git push
        fi